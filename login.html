<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Digital Sanctuary | Login & Register</title>
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container" id="container">
        <!-- Form Register / Sign Up -->
        <div class="form-container sign-up">
            <form id="registerForm">
                <h1>Buat Akun</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                </div>
                <span>atau gunakan email untuk registrasi</span>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regName" placeholder="Nama Lengkap / Panggilan" required />
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Alamat Email" required />
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Kata Sandi Rahasia" required />
                </div>
                <label class="terms-label">
                    <input type="checkbox" required /> Saya menyetujui syarat & ketentuan
                </label>
                <button type="submit" class="btn">Daftar Akun</button>
            </form>
        </div>

        <!-- Form Login / Sign In -->
        <div class="form-container sign-in">
            <form id="loginForm">
                <h1>Masuk Sanctuary</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                </div>
                <span>atau gunakan akun yang sudah ada</span>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email" required />
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Kata Sandi" required />
                </div>
                <div class="form-options">
                    <label><input type="checkbox" id="rememberMe"> Ingat Saya</label>
                    <a href="#" onclick="forgotPass()">Lupa Kata Sandi?</a>
                </div>
                <button type="submit" class="btn">Masuk Ke Website ❤️</button>
            </form>
        </div>

        <!-- Panel Geser / Overlay Slide -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1 class="font-cursive">Welcome Back!</h1>
                    <p>Sudah punya akun khusus untuk masuk ke tempat kenangan kita?</p>
                    <button class="btn hidden-btn" id="login">← Masuk / Log In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1 class="font-cursive">Halo, Sayang!</h1>
                    <p>Daftarkan diri & nama kamu dulu untuk mulai perjalanan kenangan manis kita!</p>
                    <button class="btn hidden-btn" id="register">Daftar / Sign Up →</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
